name: Daily lesson

# Builds the next lesson in ROADMAP.md every morning, opens a pull request as a record, and publishes it
# straight away by merging it (the owner reviews afterwards and asks @claude for changes).
# GitHub cron is in UTC: 10:54 UTC is 6:54 am in New York in summer (5:54 am in winter).
# Scheduled runs can start a few minutes late. To start one by hand, either click "Run workflow" on the
# Actions tab, or open an issue whose title starts with "Build the next lesson" (Claude can do that for you).
# To change a published lesson, open an issue whose title starts with "Change:" and describe what you want.
on:
  schedule:
    - cron: '54 10 * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  lesson:
    # From an issue: only "Build the next lesson…" or "Change:…" issues opened by the owner, a collaborator or a GitHub App.
    if: >-
      github.event_name != 'issues' ||
      ((startsWith(github.event.issue.title, 'Build the next lesson') || startsWith(github.event.issue.title, 'Change:')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        github.event.issue.user.type == 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the headless browser used by tools/check.sh
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      - name: Set the git author
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch"
          prompt: |
            You are the daily lesson agent for "IoT for Young Makers", a free interactive 3D course in this repository
            (${{ github.repository }}) that teaches complete beginners aged 10–15 to build IoT projects with an
            ESP32 DevKit V1 and MicroPython. It is published with GitHub Pages from the main branch.

            Read AGENT.md and ROADMAP.md in full, then follow AGENT.md exactly. Use the `gh` CLI (already logged in)
            for everything on GitHub.

            ${{ (github.event_name == 'issues' && startsWith(github.event.issue.title, 'Change:')) && format('THIS RUN IS A CHANGE REQUEST, not a new lesson. The owner opened issue #{0}: "{1}". Read it with `gh issue view {0}`. Make exactly that change (keeping every rule in AGENT.md), test it with tools/check.sh, commit on a new branch change/issue-{0}, open a pull request that says "Closes #{0}", and merge it as in step 6 below. Then comment the pull request link on the issue. Skip steps 1-5.', github.event.issue.number, github.event.issue.title) || '' }}

            1. Check open pull requests (`gh pr list`). If a lesson pull request from an earlier run is still open
               (it was left unmerged because something was broken), fix it first, test it, merge it as in step 6,
               and stop for today. Comments that mention @claude are handled by another workflow; leave those alone.
            2. Otherwise build the first unchecked lesson in ROADMAP.md, keeping the one-new-idea rule, the
               "Why is it built this way?" teaching style, the ESP32 model and the lesson-1 look.
            3. Test it with tools/check.sh and look at every screenshot; fix anything broken before committing.
            4. Mark the lesson ready in course.js, tick it in ROADMAP.md and add a dated log line.
            5. Commit on a new branch lesson/<slug>, push it, and open a pull request into main titled
               "Lesson N: <title>" with `gh pr create`. Describe the new idea, the new part and code, the wiring,
               the "Why?" questions and what you tested.
            6. Publish it: if your checks passed (no script errors, nothing broken in the screenshots), merge your own
               pull request with `gh pr merge <number> --merge --delete-branch`, then ask GitHub Pages to rebuild with
               `gh api -X POST repos/${{ github.repository }}/pages/builds || true`. If something is still broken that
               you could not fix, do not merge: leave the pull request open and explain the problem in it.
               Never push to main directly; always go through the pull request.
            ${{ github.event_name == 'issues' && format('7. This run was started by issue #{0}. When you finish, comment on that issue with the pull request link (or what blocked you) and close it with `gh issue close {0}`.', github.event.issue.number) || '' }}
