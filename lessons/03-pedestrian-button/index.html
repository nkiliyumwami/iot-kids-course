<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pedestrian Button · KundaKode</title>
<script src="../../assets/brand.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a lab bench. The 3D workbench fills the left, the lesson card sits on the right; they stack on phones. */
:root {
  --bg: #E3EBF0;
  --surface: #FFFFFF;
  --surface-2: #F1F5F8;
  --ink: #15202A;
  --muted: #526170;
  --line: #D2DCE3;
  --accent: #0A7480;
  --accent-strong: #075A63;
  --accent-soft: #DAEEF0;
  --red: #C93131;
  --amber: #A86D00;
  --amber-lamp: #FFB400;
  --green: #16834A;
  --hl: #F2B705;
  --ground: #2E3136;
  --code-bg: #13202A;
  --code-ink: #E3ECF1;
  --code-dim: #8BA0AE;
  --code-hl: #24404F;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  padding: 12px 16px 16px;
  gap: 12px;
}

/* ---------- header ---------- */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 20px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.01em;
}
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.home-link { display: inline-block; font-size: 13px; font-weight: 800; color: var(--accent-strong); text-decoration: none; margin-bottom: 2px; }
.home-link:hover { text-decoration: underline; }
.stages {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-left: auto;
}
.stage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 12px 4px 4px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}
.stage-pill b {
  display: grid;
  place-items: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--surface-2);
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--muted);
}
.stage-pill.done { color: var(--ink); }
.stage-pill.done b { background: var(--accent-soft); color: var(--accent-strong); }
.stage-pill.current { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.stage-pill.current b { background: var(--accent); color: #fff; }
.progress { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.progress .bar {
  flex: 1;
  height: 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.progress span { font-weight: 700; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- main ---------- */
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 410px);
  gap: 14px;
  min-height: 0;
}
.viewport {
  position: relative;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  background: #F3F7FA;
  border: 1px solid var(--line);
}
#scene, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scene canvas { touch-action: none; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.lbl { position: absolute; left: 0; top: 0; width: 0; height: 0; --lift: 10px; will-change: transform; color: var(--ink); }
.lbl > span {
  position: absolute;
  left: 0; bottom: var(--lift);
  transform: translateX(-50%);
  white-space: nowrap;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px 8px;
  font-weight: 800;
  font-size: 12.5px;
  box-shadow: 0 2px 8px rgba(21,32,42,.12);
  display: inline-flex; align-items: center; gap: 6px;
}
.lbl::after {
  content: '';
  position: absolute;
  left: -1px; bottom: 0;
  width: 2px; height: var(--lift);
  background: rgba(21,32,42,.45);
}
.lbl .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.25); }
.lbl.lamp.on > span { color: #fff; border-color: transparent; }
.lbl.lamp.on.red > span { background: var(--red); }
.lbl.lamp.on.yellow > span { background: var(--amber-lamp); color: var(--ink); }
.lbl.lamp.on.green > span { background: var(--green); }
.lbl.pin > span { font-family: var(--font-code); font-size: 11.5px; padding: 1px 6px; }
.lbl.pin.high > span { background: var(--hl); border-color: transparent; }
.lbl.callout > span { background: var(--ink); color: #fff; border-color: transparent; font-size: 13px; }
.lbl.callout::after { background: var(--ink); }
.lbl.callout.gold > span { background: var(--hl); color: var(--ink); }
.lbl.callout.blue > span { background: #2F6FDE; }
.lbl.callout.ground > span { background: var(--ground); }

.status {
  position: absolute;
  top: 12px; left: 12px;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 14px 8px 8px;
  box-shadow: 0 4px 14px rgba(21,32,42,.1);
}
.lamps {
  display: grid; gap: 4px;
  background: #2B3038;
  padding: 5px;
  border-radius: 10px;
}
.lamps i { width: 14px; height: 14px; border-radius: 50%; background: #4A515B; }
.lamps i.on[data-k="red"] { background: #FF4141; box-shadow: 0 0 10px #FF4141; }
.lamps i.on[data-k="yellow"] { background: var(--amber-lamp); box-shadow: 0 0 10px var(--amber-lamp); }
.lamps i.on[data-k="green"] { background: #22D36B; box-shadow: 0 0 10px #22D36B; }
.st-text { display: grid; line-height: 1.2; }
.st-text b { font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; }
.st-text small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
.st-count {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 2.2ch;
  text-align: right;
}
.st-count small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.st-badge {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  background: var(--hl); color: var(--ink); border-radius: 6px; padding: 1px 6px;
}

.reset-view {
  position: absolute;
  top: 12px; right: 12px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 10px 18px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(10,116,128,.35);
}
.reset-view:hover { background: var(--accent-strong); }
.reset-view svg { width: 18px; height: 18px; }

.presser {
  position: absolute;
  left: 50%; bottom: 40px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 10px;
  border: 2px solid var(--accent-strong); background: var(--accent); color: #fff;
  border-radius: 999px; padding: 10px 22px;
  font-family: var(--font-display); font-weight: 800; font-size: 17px;
  white-space: nowrap; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: 0 6px 16px rgba(21,32,42,.25);
}
.presser i { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .1s; }
.presser.down { background: var(--hl); color: var(--ink); border-color: var(--hl); box-shadow: 0 2px 6px rgba(21,32,42,.25); }
.presser.down i { transform: translateY(2px) scale(.9); background: var(--ink); }
.pinread { display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; text-align: center; }
.pinread div { display: grid; line-height: 1.15; }
.pinread small { font-size: 12px; font-weight: 800; color: var(--muted); }
.pinread b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.pinread span { font-size: 22px; color: var(--muted); }
.sw-diagram { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
.sw-diagram .wires { stroke: #8A929A; transition: stroke .15s; }
.sw-diagram .bridge { fill: #C9CED4; stroke: #7A828A; transition: fill .15s; }
.sw-diagram .plunger { transform: translateY(-30px); transition: transform .12s; }
.sw-diagram.on .plunger { transform: translateY(0); }
.sw-diagram.on .wires { stroke: var(--hl); }
.sw-diagram.on .bridge { fill: var(--hl); }
.sw-diagram text { font-family: var(--font-body); font-weight: 800; font-size: 11px; fill: var(--muted); }
pre.code.linecode { padding: 8px 12px; border-radius: 10px; background: var(--code-bg); color: var(--code-ink); max-height: none; overflow-x: auto; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 6px; font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: #FFF6D6; }

.live {
  position: absolute;
  left: 50%; top: 70px;
  transform: translateX(-50%);
  max-width: calc(100% - 24px);
  background: var(--ink); color: #fff;
  border-radius: 999px;
  padding: 6px 16px;
  font-weight: 700; font-size: 14px;
  text-align: center;
  box-shadow: 0 6px 16px rgba(21,32,42,.25);
}
.hint {
  position: absolute; left: 12px; bottom: 10px; margin: 0;
  font-size: 12px; font-weight: 700; color: var(--muted);
  pointer-events: none;
}

.info {
  position: absolute;
  right: 12px; bottom: 40px;
  width: min(330px, calc(100% - 24px));
  background: var(--surface);
  border: 2px solid var(--hl);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 10px 26px rgba(21,32,42,.18);
}
.info h3 { font-family: var(--font-display); font-size: 19px; margin: 0 28px 2px 0; line-height: 1.2; }
.info p { margin: 4px 0 0; }
.info .purpose { font-weight: 800; }
.info .more { color: var(--muted); font-size: 14px; }
.info .close {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; font-weight: 800;
}

/* ---------- lesson panel ---------- */
.panel {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
}
.panel-body { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.guide { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 10px; align-items: start; }
.guide svg { width: 58px; height: 70px; }
.bubble {
  position: relative;
  background: var(--surface-2);
  border-radius: 14px;
  padding: 10px 14px 12px;
}
.bubble::before {
  content: ''; position: absolute; left: -8px; top: 22px;
  border: 8px solid transparent; border-left: 0; border-right-color: var(--surface-2);
}
.eyebrow { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bubble h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.15; margin: 2px 0 6px; text-wrap: balance; }
.bubble p.text { margin: 0; font-size: 16px; }
.term { font-weight: 800; color: var(--accent-strong); }

.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.card h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
.list li.on { background: var(--accent-soft); }
.chip-lamp { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.chip-lamp.red { background: var(--red); }
.chip-lamp.yellow { background: var(--amber-lamp); }
.chip-lamp.green { background: var(--green); }
.list .secs { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.check {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: transparent;
}
.done .check { background: var(--green); border-color: var(--green); color: #fff; }
.list li.now { background: #FFF6D6; outline: 2px solid var(--hl); }
.list li.part-item { cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.list li.part-item:hover { background: var(--surface-2); }
.mono { font-family: var(--font-code); font-size: 13px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.note.safety { background: #FFF6D6; border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.legend { display: grid; gap: 6px; font-size: 14px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.sw { width: 26px; height: 10px; border-radius: 3px; flex: none; }

/* code */
.code-card { border-radius: 14px; overflow: hidden; background: var(--code-bg); color: var(--code-ink); }
.code-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; background: #0D171F; }
.code-head span { font-family: var(--font-code); font-size: 12.5px; color: var(--code-dim); }
.code-btns { display: flex; gap: 6px; }
.code-btns button {
  border: 1px solid #36505F; background: #1C2E3A; color: var(--code-ink);
  border-radius: 8px; padding: 4px 10px; font-weight: 800; font-size: 13px; cursor: pointer;
}
.code-btns button.on { background: var(--hl); color: var(--ink); border-color: var(--hl); }
pre.code {
  margin: 0;
  padding: 8px 0;
  font-family: var(--font-code);
  font-size: 12.5px;
  line-height: 1.6;
  max-height: 44vh;
  overflow: auto;
  position: relative;
}
pre.code .ln { display: block; padding: 0 12px 0 0; white-space: pre; border-left: 4px solid transparent; }
pre.code .ln::before { content: attr(data-n); display: inline-block; width: 3.2ch; margin-right: 1.2ch; text-align: right; color: #4E6676; }
pre.code .ln.hl { background: var(--code-hl); border-left-color: var(--hl); }
pre.code .ln.hl.key { background: #2E5468; }
pre.code .c { color: #8FA8B5; font-style: italic; }
pre.code .kw { color: #7FD3E0; }
pre.code .fn { color: #FFD479; }
pre.code .k2 { color: #FF9BB0; font-weight: 600; }
pre.code .num { color: #B6E68A; }
pre.code .num.flash { background: var(--hl); color: var(--ink); border-radius: 3px; }
pre.code .tick {
  margin-left: 10px; font-family: var(--font-body); font-weight: 800; font-size: 11.5px;
  background: var(--hl); color: var(--ink); border-radius: 6px; padding: 0 6px;
}
.code-note { margin: 0; padding: 8px 14px 10px; font-size: 13.5px; color: var(--code-ink); border-top: 1px solid #22323D; }
.code-note b { color: #FFD479; }

/* experiment */
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input { flex: 1; accent-color: var(--green); min-width: 0; height: 28px; }
.slider-val { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--green); min-width: 3.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 2px; }
.sum { margin: 8px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.question { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; margin: 0 0 8px; }
.reveal { margin-top: 8px; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }

.quiz-opts { display: grid; gap: 8px; }
.quiz-opts button {
  text-align: left; border: 2px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 700;
  display: flex; gap: 10px; align-items: flex-start;
}
.quiz-opts button:hover { border-color: var(--accent); }
.quiz-opts button b { font-family: var(--font-display); color: var(--accent); }
.quiz-opts button.right { border-color: var(--green); background: #E3F5EA; }
.quiz-opts button.wrong { border-color: var(--red); background: #FBE7E7; }
.feedback { border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
.feedback.good { background: #E3F5EA; }
.feedback.try { background: #FFF6D6; }
.feedback b { font-family: var(--font-display); font-size: 18px; }

/* footer controls */
.panel-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 10px; background: var(--surface); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 14px; cursor: pointer;
  flex: 1 1 auto;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.warn { color: var(--red); }
.btn.armed { background: var(--red); color: #fff; border-color: var(--red); }
.btn[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); }
.toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 14px; cursor: pointer; flex: 1 1 auto; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.why { display: grid; gap: 6px; }
.why-item { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.why-item > button {
  width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px;
  font-weight: 800; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; line-height: 1.35;
}
.why-item > button::before {
  content: '?'; flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-strong);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 15px;
}
.why-item.seen > button::before { content: '✓'; background: var(--accent); color: #fff; font-size: 13px; }
.why-item .ans { padding: 0 12px 10px 44px; }
.why-item .ans p { margin: 0; font-size: 14.5px; }
.pin-link { display: inline-block; margin-top: 6px; font-weight: 800; color: var(--accent-strong, #075A63); }
.why-item.now { border-color: var(--hl); box-shadow: inset 0 0 0 1px var(--hl); background: #FFFBEA; }
.show3d {
  margin-top: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent-strong);
  border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 13px; cursor: pointer;
}
.show3d:hover { background: var(--accent-soft); }
.analogy { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.analogy li { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr); gap: 10px; font-size: 14.5px; }
.analogy b { color: var(--accent-strong); }
.journey { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-size: 14.5px; }
.meter { position: relative; height: 22px; border-radius: 8px; overflow: hidden; background: linear-gradient(90deg, #DDF2E5 0 40%, #FBE2E2 40% 100%); border: 1px solid var(--line); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 8%; background: var(--green); border-radius: 8px; transition: width .6s, background .3s; }
.meter i.danger { background: var(--red); }

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!window.THREE || !THREE.OrbitControls) {
  $('#scene').innerHTML = '<div class="fail">The 3D library could not load. Check your internet connection and reload the page.</div>';
  return;
}

/* =========================================================
   Board geometry. 1 unit ≈ 1 cm; breadboard hole pitch 0.25.
   ========================================================= */
const P = 0.25;
const colX = (c) => (c - 15.5) * P;
const ROWZ = { a: -1.375, b: -1.125, c: -0.875, d: -0.625, e: -0.375, f: 0.375, g: 0.625, h: 0.875, i: 1.125, j: 1.375 };
const FAR_ROWS = ['a', 'b', 'c', 'd', 'e'], NEAR_ROWS = ['f', 'g', 'h', 'i', 'j'];
const NEG_RAIL_Z = 2.2, POS_RAIL_Z = 1.95;
const RAIL_COLS = [];
for (let c = 1; c <= 30; c++) if ((c - 1) % 6 !== 0) RAIL_COLS.push(c);
const HEADER_Z = -3.45, HEADER_TOP = -0.05, SLEEVE = 0.27;
const PIN_X = { D32: -0.5, D25: 0, D26: 0.25, D27: 0.5, GND: 1.5 };

const CH = [
  { key: 'red', name: 'Red', word: 'Stop', pin: 'D25', num: 25, col: 7, hex: 0xff3030, wire: 0xe0413b },
  { key: 'yellow', name: 'Yellow', word: 'Get ready to stop', pin: 'D26', num: 26, col: 15, hex: 0xffb400, wire: 0xf2c12e },
  { key: 'green', name: 'Green', word: 'Go', pin: 'D27', num: 27, col: 23, hex: 0x1fd067, wire: 0x2fae5f },
];

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const holeAt = (c, r, y = 0) => V(colX(c), y, ROWZ[r]);
const railAt = (c, y = 0) => V(colX(c), y, NEG_RAIL_Z);
const pinAt = (n, y = HEADER_TOP) => V(PIN_X[n], y, HEADER_Z);

/* =========================================================
   Renderer, scene, camera
   ========================================================= */
const host = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  host.innerHTML = '<div class="fail">This device could not start 3D graphics (WebGL). Try another browser.</div>';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f7fa);
scene.fog = new THREE.Fog(0xf3f7fa, 34, 70);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(0.5, 6.2, 10.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.minDistance = 2.5;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.47;
controls.target.set(0, 0.6, -1.2);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcdd8e0, 0.72));
scene.add(new THREE.AmbientLight(0xffffff, 0.16));
const sun = new THREE.DirectionalLight(0xffffff, 0.62);
sun.position.set(6, 15, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0006;
sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfefff, 0.22);
fill.position.set(-8, 6, -4);
scene.add(fill);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o));
function mesh(geo, m, x = 0, y = 0, z = 0, shadow = true) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = shadow; o.receiveShadow = true;
  return o;
}
function rod(a, b, r, m) {
  const d = b.clone().sub(a);
  const o = mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), m);
  o.position.copy(a).add(b).multiplyScalar(0.5);
  o.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  return o;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const metal = mat(0xc9ced4, { metalness: 0.3, roughness: 0.35 });

/* ---------- table ---------- */
const table = mesh(new THREE.BoxGeometry(30, 0.6, 20), mat(0xe6d3b5, { roughness: 0.85 }), 0, -0.7, -2, false);
scene.add(table);
const matPad = mesh(new THREE.BoxGeometry(17, 0.02, 13.4), mat(0xcfe2e6, { roughness: 0.95 }), 0.6, -0.39, -2.6, false);
scene.add(matPad);

const pickables = [];
function tagPart(obj, part) {
  obj.userData.part = part;
  pickables.push(obj);
}

/* ---------- breadboard ---------- */
function breadboardTexture(W, D) {
  const S = 180;
  const c = document.createElement('canvas');
  c.width = Math.round(W * S); c.height = Math.round(D * S);
  const g = c.getContext('2d');
  const U = (x) => (x + W / 2) * S, Z = (z) => (z + D / 2) * S;
  g.fillStyle = '#f8f8f4'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#dcddd5'; g.fillRect(0, Z(-0.13), c.width, 0.26 * S);
  const line = (z, col) => { g.fillStyle = col; g.fillRect(U(colX(1) - 0.2), Z(z) - 0.014 * S, (colX(30) - colX(1) + 0.4) * S, 0.028 * S); };
  line(-2.42, '#2f6fde'); line(-1.76, '#d93b3b'); line(1.76, '#d93b3b'); line(2.42, '#2f6fde');
  const hole = (x, z) => { const s = 0.1 * S; g.fillStyle = '#41464c'; roundRect(g, U(x) - s / 2, Z(z) - s / 2, s, s, s * 0.22); g.fill(); };
  for (let col = 1; col <= 30; col++) for (const r in ROWZ) hole(colX(col), ROWZ[r]);
  for (const col of RAIL_COLS) { hole(colX(col), POS_RAIL_Z); hole(colX(col), NEG_RAIL_Z); hole(colX(col), -1.95); hole(colX(col), -2.2); }
  g.fillStyle = '#6f7a85'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${0.115 * S}px Nunito, Arial, sans-serif`;
  for (let col = 1; col <= 30; col++) { g.fillText(String(col), U(colX(col)), Z(-1.58)); g.fillText(String(col), U(colX(col)), Z(1.58)); }
  for (const r in ROWZ) { g.fillText(r, U(colX(0)), Z(ROWZ[r])); g.fillText(r, U(colX(31)), Z(ROWZ[r])); }
  g.font = `800 ${0.2 * S}px Nunito, Arial, sans-serif`;
  const sign = (t, col, z, fillc) => { g.fillStyle = fillc; g.fillText(t, U(colX(col)), Z(z)); };
  sign('−', 0, NEG_RAIL_Z, '#2f6fde'); sign('−', 31, NEG_RAIL_Z, '#2f6fde');
  sign('+', 0, POS_RAIL_Z, '#d93b3b'); sign('+', 31, POS_RAIL_Z, '#d93b3b');
  sign('−', 0, -2.2, '#2f6fde'); sign('+', 0, -1.95, '#d93b3b');
  sign('−', 31, -2.2, '#2f6fde'); sign('+', 31, -1.95, '#d93b3b');
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeBreadboard() {
  const g = new THREE.Group();
  const W = 8.4, D = 5.3, H = 0.4;
  g.add(mesh(new THREE.BoxGeometry(W, H, D), mat(0xf2f2ec, { roughness: 0.8 }), 0, -H / 2 - 0.001, 0));
  const top = mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ map: breadboardTexture(W, D), roughness: 0.85 }), 0, 0.001, 0, false);
  top.rotation.x = -Math.PI / 2;
  g.add(top);
  tagPart(g, 'breadboard');
  return g;
}

/* ---------- controller board: ESP32 DevKit V1 (30-pin), pins pointing up ----------
   Laid out from a top view of the real board: antenna end on the left, micro-USB on the right,
   the EN…VIN pin row nearest the breadboard and the D23…3V3 row at the back. Rows are 0.9" apart. */
const NEAR_PINS = ['EN', 'VP', 'VN', 'D34', 'D35', 'D32', 'D33', 'D25', 'D26', 'D27', 'D14', 'D12', 'D13', 'GND', 'VIN'];
const FAR_PINS = ['D23', 'D22', 'TX0', 'RX0', 'D21', 'D19', 'D18', 'D5', 'TX2', 'RX2', 'D4', 'D2', 'D15', 'GND', '3V3'];
const FAR_HEADER_Z = HEADER_Z - 0.9 * 2.54;
const pinColX = (k) => (k - 7) * P;
const ESP = { x0: pinColX(0) - 0.48, x1: pinColX(14) + 0.65, z0: FAR_HEADER_Z - 0.1, z1: HEADER_Z + 0.1, y: -0.2 };
ESP.cx = (ESP.x0 + ESP.x1) / 2; ESP.cz = (ESP.z0 + ESP.z1) / 2;
ESP.W = ESP.x1 - ESP.x0; ESP.D = ESP.z1 - ESP.z0;

function canvasFor(w, d, S) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * S); c.height = Math.round(d * S);
  return [c, c.getContext('2d')];
}
function texFrom(c) {
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function esp32Texture() {
  const { cx, cz, W, D } = ESP;
  const S = 220;
  const [c, g] = canvasFor(W, D, S);
  const U = (x) => (x - cx + W / 2) * S, Z = (z) => (z - cz + D / 2) * S;
  g.fillStyle = '#4a4b4f'; g.fillRect(0, 0, c.width, c.height);
  // mounting holes
  g.fillStyle = '#f3f7fa';
  for (const x of [ESP.x0 + 0.2, ESP.x1 - 0.2]) for (const z of [cz - 1.02, cz + 1.02]) { g.beginPath(); g.arc(U(x), Z(z), 0.12 * S, 0, Math.PI * 2); g.fill(); }
  // through-hole pads (square for VIN and 3V3)
  for (const z of [HEADER_Z, FAR_HEADER_Z]) for (let k = 0; k < 15; k++) {
    const x = pinColX(k);
    g.fillStyle = '#c9ccd1'; g.strokeStyle = '#8d9096'; g.lineWidth = 3;
    if (k === 14) { g.fillRect(U(x) - 0.09 * S, Z(z) - 0.09 * S, 0.18 * S, 0.18 * S); }
    else { g.beginPath(); g.arc(U(x), Z(z), 0.095 * S, 0, Math.PI * 2); g.fill(); g.stroke(); }
  }
  // silkscreen pin names
  g.fillStyle = '#ffffff'; g.textBaseline = 'middle';
  g.font = `800 ${0.11 * S}px Nunito, Arial, sans-serif`;
  const vert = (t, x, z, align) => { g.save(); g.translate(U(x), Z(z)); g.rotate(-Math.PI / 2); g.textAlign = align; g.fillText(t, 0, 0); g.restore(); };
  NEAR_PINS.forEach((t, k) => vert(t, pinColX(k), HEADER_Z - 0.14, 'left'));
  FAR_PINS.forEach((t, k) => vert(t, pinColX(k), FAR_HEADER_Z + 0.14, 'right'));
  vert('EN', ESP.x1 - 0.42, cz + 0.4, 'center');
  vert('BOOT', ESP.x1 - 0.42, cz - 0.42, 'center');
  // small surface-mount parts
  const smd = (x, z, w, d, body) => {
    g.fillStyle = '#d9dbde'; g.fillRect(U(x - w / 2), Z(z - d / 2), w * S, d * S);
    g.fillStyle = body; g.fillRect(U(x - w / 2) + 0.03 * S, Z(z - d / 2) + 0.03 * S, (w - 0.06) * S, (d - 0.06) * S);
  };
  for (let k = 0; k < 5; k++) smd(0.42, cz + 0.15 - k * 0.15, 0.2, 0.1, '#111');
  smd(0.32, cz + 0.65, 0.1, 0.2, '#c9a27a'); smd(0.45, cz + 0.65, 0.1, 0.2, '#c9a27a');
  smd(0.32, cz - 0.68, 0.1, 0.2, '#111'); smd(0.45, cz - 0.68, 0.1, 0.2, '#111');
  for (const z of [cz + 0.62, cz + 0.32, cz - 0.05]) smd(ESP.x1 - 0.85, z, 0.1, 0.2, '#111');
  smd(ESP.x1 - 0.85, cz + 0.02, 0.1, 0.2, '#c9a27a');
  for (const z of [cz - 0.4, cz - 0.7]) smd(ESP.x1 - 0.85, z, 0.1, 0.2, '#111');
  smd(0.72, cz - 0.7, 0.18, 0.1, '#111');
  // highlight the pins this lesson uses
  g.strokeStyle = '#F2B705'; g.lineWidth = 6;
  roundRect(g, U(pinColX(7) - 0.15), Z(HEADER_Z - 0.62), 0.8 * S, 0.76 * S, 12); g.stroke();
  roundRect(g, U(pinColX(13) - 0.15), Z(HEADER_Z - 0.62), 0.3 * S, 0.76 * S, 12); g.stroke();
  return texFrom(c);
}
function moduleTexture(w, d) {
  const S = 220;
  const [c, g] = canvasFor(w, d, S);
  g.fillStyle = '#1b1b1c'; g.fillRect(0, 0, c.width, c.height);
  // castellated pads along both long sides and the inner end
  g.fillStyle = '#e8d36a';
  for (let k = 0; k < 13; k++) {
    const x = (0.62 + k * 0.105) * S;
    g.fillRect(x, 0, 0.06 * S, 0.07 * S);
    g.fillRect(x, c.height - 0.07 * S, 0.06 * S, 0.07 * S);
  }
  for (let k = 0; k < 10; k++) g.fillRect(c.width - 0.07 * S, (0.32 + k * 0.105) * S, 0.07 * S, 0.06 * S);
  // printed antenna trace (zig-zag)
  g.strokeStyle = '#3b3b3d'; g.lineWidth = 0.05 * S; g.lineJoin = 'miter';
  const pts = [[0.48, 0.1], [0.1, 0.1], [0.1, 0.3], [0.48, 0.3], [0.48, 0.55], [0.1, 0.55], [0.1, 0.78], [0.48, 0.78], [0.48, 1.0], [0.1, 1.0], [0.1, 1.3], [0.36, 1.3]];
  g.beginPath(); pts.forEach(([x, z], i) => (i ? g.lineTo(x * S, z * S) : g.moveTo(x * S, z * S))); g.stroke();
  return texFrom(c);
}
function shieldTexture(w, d) {
  const S = 220;
  const [c, g] = canvasFor(w, d, S);
  g.fillStyle = '#a7aaae'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#f2f3f4'; g.lineWidth = 6; g.strokeRect(3, 3, c.width - 6, c.height - 6);
  g.save(); g.translate(c.width / 2, c.height / 2); g.rotate(Math.PI / 2);
  g.fillStyle = '#f4f5f6'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `800 ${0.16 * S}px Nunito, Arial, sans-serif`;
  g.fillText('ESP-WROOM-32', 0, -0.36 * S);
  g.font = `800 ${0.34 * S}px Nunito, Arial, sans-serif`;
  g.fillText('C  E', -0.12 * S, 0.02 * S);
  g.font = `700 ${0.09 * S}px Nunito, Arial, sans-serif`;
  g.fillText('FCC ID: 2AC7Z-ESPWROOM32', 0, 0.4 * S);
  g.restore();
  g.fillStyle = '#111'; g.beginPath(); g.arc(c.width - 0.14 * S, c.height - 0.14 * S, 0.05 * S, 0, Math.PI * 2); g.fill();
  return texFrom(c);
}

/* ---------- LED ---------- */
function flangeGeometry(r, h) {
  const s = new THREE.Shape();
  const cut = 0.8 * r, a = Math.acos(cut / r);
  s.absarc(0, 0, r, a, Math.PI * 2 - a, false);
  s.lineTo(cut, r * Math.sin(a));
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 28 });
  geo.rotateX(-Math.PI / 2);
  return geo;
}
let glowTexture = null;
function getGlowTexture() {
  if (glowTexture) return glowTexture;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.25, 'rgba(255,255,255,.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  glowTexture = new THREE.CanvasTexture(c);
  return glowTexture;
}
function makeLED(hex, scale = 1, legs = [0.5, 0.5], spread = P) {
  const g = new THREE.Group();
  const s = scale;
  const leg = mat(0xc9ced4, { metalness: 0.3, roughness: 0.35 });
  const legTop = 0.45 * s;
  const anode = rod(V(0, legTop - legs[0] * s, 0), V(0, legTop, 0), 0.018 * s, leg);
  const cathode = rod(V(spread, legTop - legs[1] * s, 0), V(spread, legTop, 0), 0.018 * s, leg);
  g.add(anode, cathode);
  const body = mat(hex, { transparent: true, opacity: 0.8, roughness: 0.22, emissive: hex, emissiveIntensity: 0.06 });
  const cx = spread / 2;
  const flange = mesh(flangeGeometry(0.29 * s, 0.06 * s), body, cx, legTop, 0);
  const barrel = mesh(new THREE.CylinderGeometry(0.25 * s, 0.25 * s, 0.32 * s, 28), body, cx, legTop + 0.06 * s + 0.16 * s, 0);
  const dome = mesh(new THREE.SphereGeometry(0.25 * s, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), body, cx, legTop + 0.38 * s, 0);
  g.add(flange, barrel, dome);
  const light = new THREE.PointLight(hex, 0, 4.5 * s, 2);
  light.position.set(cx, legTop + 0.4 * s, 0);
  g.add(light);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: getGlowTexture(), color: hex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.set(1.7 * s, 1.7 * s, 1);
  glow.position.set(cx, legTop + 0.35 * s, 0);
  g.add(glow);
  g.userData.led = { body, light, glow, base: new THREE.Color(hex), dim: new THREE.Color(hex).lerp(new THREE.Color(0x6b7280), 0.55) };
  body.color.copy(g.userData.led.dim);
  return g;
}

/* ---------- resistor (330 Ω: orange, orange, brown, gold) ---------- */
function makeResistor() {
  const g = new THREE.Group();
  const lead = mat(0xc9ced4, { metalness: 0.3, roughness: 0.35 });
  const zA = ROWZ.d, zB = ROWZ.g, yb = 0.3, half = 0.27;
  g.add(rod(V(0, -0.05, zA), V(0, yb, zA), 0.016, lead));
  g.add(rod(V(0, -0.05, zB), V(0, yb, zB), 0.016, lead));
  g.add(rod(V(0, yb, zA), V(0, yb, -half), 0.016, lead));
  g.add(rod(V(0, yb, half), V(0, yb, zB), 0.016, lead));
  const bodyMat = mat(0xd8c08e, { roughness: 0.5 });
  const body = mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.42, 20), bodyMat, 0, yb, 0);
  body.rotation.x = Math.PI / 2;
  g.add(body);
  for (const z of [-0.2, 0.2]) g.add(mesh(new THREE.SphereGeometry(0.1, 16, 12), bodyMat, 0, yb, z));
  const bands = [[-0.17, 0xf08a24], [-0.08, 0xf08a24], [0.01, 0x7a4a22], [0.17, 0xc9a227]];
  for (const [z, col] of bands) {
    const b = mesh(new THREE.CylinderGeometry(0.094, 0.094, 0.045, 20), mat(col, { roughness: 0.4, metalness: col === 0xc9a227 ? 0.6 : 0 }), 0, yb, z);
    b.rotation.x = Math.PI / 2;

  }

}

/* ---------- jumper wire ---------- */
const SEGS = 120, RADIAL = 10;
function makeWire(points, color) {
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, SEGS, 0.045, RADIAL, false);
  const tube = mesh(geo, mat(color, { roughness: 0.45 }));
  g.add(tube);
  const sleeveMat = mat(0x24272c, { roughness: 0.5 });
  const pinMat = metal;
  const ends = [];
  for (const p of [points[0], points[points.length - 1]]) {
    const e = new THREE.Group();
    e.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, SLEEVE, 12), sleeveMat, p.x, p.y - SLEEVE / 2, p.z));
    e.add(mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.12, 8), pinMat, p.x, p.y - SLEEVE - 0.05, p.z));
    g.add(e); ends.push(e);
  }
  const w = { group: g, curve, geo, ends, progress: 1 };
  w.set = (f) => {
    w.progress = f;
    geo.setDrawRange(0, Math.floor(f * SEGS) * RADIAL * 6);
    ends[0].visible = f > 0;
    ends[1].visible = f >= 1;
  };
  tagPart(g, 'wire');
  return w;
}

/* ---------- model road: cars obey the same traffic light ----------
   A pretend street behind the board, so learners see what each light means for real traffic.
   Red: cars wait at the stop line. Yellow: a car that can stop safely stops; a car too close to stop
   carries on (it is safer than braking hard). Green: cars cross. It follows litIndex, so the slider,
   Pause, step-through and the broken-loop demo all change the traffic too. */

(function buildRoad() {

  const asphalt = mat(0x3d454e, { roughness: 0.92 }), paint = mat(0xf4f6f8, { roughness: 0.6 }), amberPaint = mat(0xf2b705, { roughness: 0.6 });
  const walk = mat(0xd8dee3, { roughness: 0.9 }), curb = mat(0xb9c2c9, { roughness: 0.85 });
  flat(ROAD_X * 2 + 1, ROAD_W, asphalt, 0, ROAD_Z);
  for (const side of [-1, 1]) {

    flat(ROAD_X * 2 + 1, 0.72, walk, 0, z, 0, 0.1);
    flat(ROAD_X * 2 + 1, 0.06, curb, 0, ROAD_Z + side * (ROAD_W / 2 + 0.03), 0, 0.11);

// clean, simple cars: an extruded side profile, tinted glass, wheels, head and brake lights
function makeCar(hex) {

  const wheels = [];
  for (const x of [-0.5, 0.5]) for (const z of [-0.33, 0.33]) {

    const t = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 20), tyre); t.rotation.x = Math.PI / 2; w.add(t);
    const h = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.105, 12), hub); h.rotation.x = Math.PI / 2; w.add(h);
    g.add(w); wheels.push(w);
  }
  const head = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xfff2c0, emissiveIntensity: 0.5 });
  const brake = new THREE.MeshStandardMaterial({ color: 0x8a1c1c, emissive: 0xff2020, emissiveIntensity: 0.15 });
  for (const z of [-0.22, 0.22]) {

const CAR_COLOURS = [0xf4f6f8, 0x2c4e9e, 0x0a7480, 0xd9821a, 0x5b6670, 0xc93131, 0x1f262d, 0x7fa8c9];

  const g = makeCar(CAR_COLOURS[k]);
  g.rotation.y = dir > 0 ? 0 : Math.PI;
  road.add(g);

function placeCar(c) {
  c.g.position.set(c.dir * c.s, 0, ROAD_Z + c.dir * LANE);
  const a = Math.max(0, Math.min(1, (ROAD_X - Math.abs(c.s)) / FADE));
  c.g.visible = a > 0.01;
  if (a !== c.a) { c.a = a; c.g.traverse((o) => { if (o.material) { o.material.transparent = a < 1; o.material.opacity = a; } }); }
}
function updateRoad(dt) {
  if (!road.visible) return;
  // the road follows the lights on the breadboard: no light (circuit off, or loop broken) means nobody may go
  const state = litIndex === 2 ? 'go' : litIndex === 1 ? 'warn' : 'stop';
  for (const dir of [1, -1]) {
    const lane = cars.filter((c) => c.dir === dir).sort((a, b) => b.s - a.s);
    let entered = false; // one car per lane may come back in each frame
    lane.forEach((c, i) => {
      const front = c.s + CAR_L / 2;
      const before = front <= STOP_S + 0.02;
      if (!before) { c.go = false; c.warned = false; }
      // yellow or a sudden red: decide once. Too close to stop gently → carry on; otherwise stop at the line.
      if (before && (state === 'warn' || state === 'stop') && !c.warned) {
        c.warned = true;
        const d = STOP_S - front;
        c.go = d < (c.v * c.v) / (2 * CAR_COMFY) && c.v > 0.5; // stopping here would need hard braking
      }
      if (state === 'go') { c.go = false; c.warned = false; }
      let limit = Infinity;
      if (before && state !== 'go' && !c.go) limit = STOP_S - CAR_L / 2 - 0.06;
      // keep a safe gap to the car in front (the lane wraps round, so the first car follows the last one)
      const lead = i > 0 ? lane[i - 1] : null;
      if (lead && lead.g.visible) limit = Math.min(limit, lead.s - CAR_L - GAP);
      const room = Math.max(0, limit - c.s);
      const target = reduceMotion ? 0 : Math.min(c.vmax, Math.sqrt(2 * CAR_B * room));
      const before_v = c.v;
      c.v += Math.max(-CAR_B * 2 * dt, Math.min(CAR_A * dt, target - c.v));
      c.v = Math.max(0, c.v);
      c.s = Math.min(c.s + c.v * dt, limit === Infinity ? Infinity : Math.max(c.s, limit));
      // drove off the far end: come back in at the start, if there is space
      // (after a short random wait, at a slightly different speed, so the traffic doesn't fall into step with the lights)
      if (c.s > ROAD_X + 0.2) {
        if (c.wait == null) c.wait = Math.random() * 3;
        c.wait -= dt;
        const last = lane[lane.length - 1];
        if (c.wait <= 0 && !entered && (last === c || last.s > -ROAD_X + CAR_L + GAP)) {
          entered = true;
          c.s = -ROAD_X - 0.2; c.vmax = 2 + Math.random() * 0.8; c.v = c.vmax * 0.8; c.wait = null;
        }
      }
      c.g.userData.wheels.forEach((w) => { w.rotation.z -= (c.v * dt) / 0.15; });

        c.g.userData.brake.forEach((m) => { m.emissiveIntensity = braking ? 1.6 : 0.15; });
      }
      placeCar(c);
    });
  }
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables.filter(visibleInScene), true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.part) o = o.parent;
    if (o && visibleInScene(o)) { selectPart(o.userData.part, o); return; }
  }

  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = paused ? 0 : rdt;
  updateTweens(dt);
  updateCam(rdt);
  updateSim(dt);
  updateRoad(dt);
  updateFlow(dt);
  bigLed.visible = false;
  // Officer Ohm bobs and waves at each new step
  const tt = now / 1000;
  cop.position.y = -0.4 + Math.sin(tt * 2) * 0.03;
  const armR = cop.userData.armR;
  if (copWave > 0) { copWave -= rdt; armR.rotation.z = 2.5 + Math.sin(tt * 11) * 0.35; }
  else armR.rotation.z += (0.15 - armR.rotation.z) * Math.min(1, rdt * 5);
  for (const o of temps) if (o.userData.pulse) o.scale.setScalar(1 + 0.22 * Math.sin(tt * 6));
  if (selHelper) selHelper.update();
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  updateStatus();
  updateCodeHighlight();
  requestAnimationFrame(frame);
}

if (window.ESP32) ESP32.initWords();
if (window.innerWidth < 600) { showLabels = false; $('#labelsToggle').checked = false; }
goTo(0, { instant: true });
requestAnimationFrame(frame);

// expose a tiny hook for automated checks
window.__lesson = { camera, controls, goTo, get step() { return stepIndex; }, sim, setHeld, selectPart, cars, tick(dt) { updateSim(dt); updateRoad(dt); } };
  // the program for "Try it on my real board": exactly the code shown in this lesson
  window.__lessonProgram = () => codeLines(true, sim.cfg).map((l) => l[0]).join('\n') + '\n';
})();
</script>
