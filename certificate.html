<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate · KundaKode</title>
<script src="assets/brand.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a printable landscape certificate (A4 / Letter) with on-screen controls above it. */
:root {
  --bg: #E3EBF0; --surface: #FFFFFF; --ink: #15202A; --muted: #526170; --line: #D2DCE3;
  --accent: #0A7480; --accent-strong: #075A63; --accent-soft: #DAEEF0; --gold: #F2B705; --gold-d: #C99600;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-sign: 'Caveat', 'Comic Sans MS', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
.controls a.back { font-weight: 800; color: var(--accent-strong); text-decoration: none; margin-right: auto; }
.field { display: grid; gap: 4px; font-weight: 800; font-size: 14px; }
.field input { font: inherit; font-weight: 700; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; min-width: min(280px, 70vw); }
.field input:focus { outline: 3px solid var(--gold); border-color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 18px; font: inherit; font-weight: 800; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; }
.btn:hover { background: var(--accent-strong); }
.scroller { overflow-x: auto; }

.cert {
  position: relative; width: 1000px; aspect-ratio: 297 / 210; margin: 0 auto;
  background: var(--surface); border-radius: 6px; overflow: hidden;
  box-shadow: 0 10px 30px rgba(21,32,42,.15);
}
.cert svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; }
.cert .inner { position: absolute; inset: 64px 90px 56px; display: grid; grid-template-rows: auto auto auto 1fr auto; text-align: center; }
.middle { align-self: center; display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-display); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-size: 16px; }
h1 { font-family: var(--font-display); font-size: 54px; line-height: 1; margin: 4px 0 6px; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 46px; color: var(--accent-strong); border-bottom: 3px dotted var(--ink); margin: 10px auto 6px; min-width: 60%; padding: 0 20px; line-height: 1.25; }
.name.empty { color: #9AA6B0; }
.what { font-size: 19px; margin: 6px 0 0; }
.what b { font-family: var(--font-display); font-size: 22px; }
.skills { display: grid; justify-content: center; gap: 8px; margin: 18px auto 0; padding: 14px 26px; list-style: none; font-size: 18px; font-weight: 700; text-align: left; background: #F1F8F9; border-radius: 14px; }
.skills-title { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 16px 0 0; }
.skills li::before { content: '✔ '; color: var(--accent); }
.foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px; padding-right: 70px; }
.sig { text-align: center; }
.sig .line { border-top: 2px solid var(--ink); padding-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.sig .val { font-size: 22px; font-weight: 800; min-height: 36px; }
.sig .script { font-family: var(--font-sign); font-size: 40px; line-height: 1; color: var(--accent-strong); }
.seal { width: 140px; height: 140px; }
.ohm { position: absolute; right: 40px; bottom: 40px; width: 110px; }
.cert-logo { justify-self: center; font-size: 22px; margin: -18px 0 6px; }
.badges-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.badges-row img { width: 54px; height: 54px; }

.locked { max-width: 560px; margin: 40px auto; text-align: center; background: var(--surface); border-radius: 18px; padding: 28px 22px; border: 1px solid var(--line); }
.locked img { width: 120px; filter: grayscale(1); opacity: .5; }
.locked h2 { font-family: var(--font-display); margin: 10px 0 6px; }

@media print {
  @page { size: landscape; margin: 0; }
  body { background: #fff; }
  .controls, .hint { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .cert { box-shadow: none; width: 100%; border-radius: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="controls" id="controls">
    <a class="back" href="lessons.html">← All lessons</a>
    <label class="field" for="nameInput">Your name for the certificate
      <input id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Type your name">
    </label>
    <button class="btn" id="printBtn" type="button">🖨️ Print or save as PDF</button>
  </div>
  <p class="hint" style="margin:-6px 0 14px;color:var(--muted);font-size:14px">Tip: in the print window choose “Save as PDF” to keep it, or print it in colour or black and white.</p>
  <div id="locked" class="locked" hidden></div>
  <div class="scroller" id="certWrap">
    <div class="cert" id="cert">
      <svg class="frame" viewBox="0 0 1000 707" aria-hidden="true" preserveAspectRatio="none">
        <rect x="18" y="18" width="964" height="671" rx="14" fill="none" stroke="#0A7480" stroke-width="6"/>
        <rect x="32" y="32" width="936" height="643" rx="10" fill="none" stroke="#F2B705" stroke-width="2"/>
        <g fill="none" stroke="#0A7480" stroke-width="2" opacity=".35">
          <path d="M32,120 h40 v-40 h50 M32,160 h70 v30 h30"/>
          <path d="M968,120 h-40 v-40 h-50 M968,160 h-70 v30 h-30"/>
          <path d="M32,590 h40 v40 h50 M32,550 h70 v-30 h30"/>
          <path d="M968,590 h-40 v40 h-50 M968,550 h-70 v-30 h-30"/>
        </g>
        <g fill="#0A7480" opacity=".5">
          <circle cx="122" cy="80" r="5"/><circle cx="132" cy="190" r="5"/><circle cx="878" cy="80" r="5"/><circle cx="868" cy="190" r="5"/>
          <circle cx="122" cy="630" r="5"/><circle cx="132" cy="520" r="5"/><circle cx="878" cy="630" r="5"/><circle cx="868" cy="520" r="5"/>
        </g>
        <g transform="translate(60,46)"><rect width="26" height="60" rx="8" fill="#2B3038"/><circle cx="13" cy="12" r="7" fill="#FF4141"/><circle cx="13" cy="30" r="7" fill="#FFB400"/><circle cx="13" cy="48" r="7" fill="#22D36B"/></g>
      </svg>
      <div class="inner">
        <span class="cert-logo" data-kk-logo></span>
        <div class="eyebrow">IoT for Young Makers</div>
        <h1 id="certTitle">Certificate of Achievement</h1>
        <div class="middle">
          <div class="name empty" id="certName">Your name here</div>
          <p class="what" id="certWhat"></p>
          <p class="skills-title">Skills learned</p>
          <ul class="skills" id="certSkills"></ul>
          <div class="badges-row" id="certBadges" hidden></div>
        </div>
        <div class="foot">
          <div class="sig"><div class="val" id="certDate"></div><div class="line">Date</div></div>
          <img class="seal" id="certSeal" alt="">
          <div class="sig"><div class="val script">Officer Ohm</div><div class="line">Signed: Officer Ohm, course guide</div></div>
        </div>
      </div>
      <img class="ohm" src="assets/ohm/thumbs.svg" alt="">
    </div>
  </div>
</div>
<script src="course.js"></script>
<script>
(function () {
  'use strict';
  const C = window.COURSE;
  const params = new URLSearchParams(location.search);
  const which = params.get('lesson') || 'all';
  const preview = params.get('preview') === '1';
  const prog = C.readProgress();
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  const lesson = which === 'all' ? null : C.lessonBySlug(which);
  const allLessons = C.lessons;
  const earned = (l) => !!(prog[l.slug] && prog[l.slug].done);
  const unlocked = preview || (lesson ? earned(lesson) : allLessons.every(earned));

  if (!unlocked) {
    $('controls').hidden = true; $('certWrap').hidden = true;
    document.querySelector('.hint').hidden = true;
    const box = $('locked'); box.hidden = false;
    if (lesson) {
      box.innerHTML = `<img src="${C.badgeSrc(lesson)}" alt=""><h2>Finish Lesson ${lesson.n} to unlock this certificate</h2>
        <p>Complete the lesson and its quiz, then come back here.</p>
        <a class="btn" href="lessons/${lesson.slug}/index.html">Go to Lesson ${lesson.n} →</a>`;
    } else {
      const left = allLessons.filter((l) => !earned(l)).length;
      box.innerHTML = `<img src="assets/ohm/celebrate.svg" alt="" style="filter:none;opacity:1"><h2>The course certificate unlocks after all ${allLessons.length} lessons</h2>
        <p>You have ${left} lesson${left === 1 ? '' : 's'} to go. Keep going!</p><a class="btn" href="lessons.html">Back to the lessons</a>`;
    }
    return;
  }

  if (lesson) {
    $('certWhat').innerHTML = `has completed <b>Lesson ${lesson.n}: ${esc(lesson.title)}</b>`;
    $('certSkills').innerHTML = lesson.skills.map((s) => `<li>${esc(s)}</li>`).join('');
    $('certSeal').src = C.badgeSrc(lesson);
    $('certSeal').alt = `Lesson ${lesson.n} badge`;
    document.title = `Lesson ${lesson.n} certificate · KundaKode`;
  } else {
    $('certTitle').textContent = 'Course Completion Certificate';
    $('certWhat').innerHTML = `has completed <b>all ${allLessons.length} lessons of IoT for Young Makers</b>`;
    $('certSkills').innerHTML = ['Built and coded circuits with an ESP32', 'Read buttons and sensors', 'Controlled a traffic light from a phone over Wi-Fi']
      .map((s) => `<li>${esc(s)}</li>`).join('');
    const row = $('certBadges'); row.hidden = false;
    row.innerHTML = allLessons.map((l) => `<img src="${C.badgeSrc(l)}" alt="Lesson ${l.n} badge">`).join('');
    $('certSeal').src = 'assets/ohm/celebrate.svg'; $('certSeal').alt = '';
    document.querySelector('.cert .ohm').hidden = true;
  }
  $('certDate').textContent = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

  const input = $('nameInput'), out = $('certName');
  function showName() {
    const v = input.value.trim();
    out.textContent = v || 'Your name here';
    out.classList.toggle('empty', !v);
  }
  try { input.value = localStorage.getItem('iotkids.name') || ''; } catch (e) {}
  input.addEventListener('input', () => { showName(); try { localStorage.setItem('iotkids.name', input.value.trim()); } catch (e) {} });
  showName();
  $('printBtn').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
