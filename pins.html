<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 Pin Explorer · KundaKode</title>
<script src="assets/brand.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 3D board on the left with a label on every pin, the pin's card on the right.
   Two views: Explorer (4 simple groups, plain words first) and Pro (7 engineering groups, code open). */
:root {
  --bg: #E3EBF0; --surface: #FFFFFF; --surface-2: #F1F5F8; --ink: #15202A; --muted: #526170; --line: #D2DCE3;
  --accent: #0A7480; --accent-strong: #075A63; --accent-soft: #DAEEF0; --hl: #F2B705;
  --code-bg: #13202A; --code-ink: #E3ECF1;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; padding: 12px 16px 16px; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top a.back { font-weight: 800; color: var(--accent-strong); text-decoration: none; font-size: 13px; }
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0; line-height: 1.05; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.bookbtn { border: 2px solid var(--hl); background: #FFF6D6; border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 800; font-size: 13px; cursor: pointer; }
.legend button i { width: 18px; height: 18px; border-radius: 50%; }
.legend button[aria-pressed="true"] { outline: 2px solid var(--ink); }
.legend .hint { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); gap: 14px; min-height: 0; }
.viewport { position: relative; min-height: 0; border-radius: 18px; overflow: hidden; background: #F3F7FA; border: 1px solid var(--line); }
#scene, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scene canvas { touch-action: none; cursor: grab; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.reset { position: absolute; top: 12px; right: 12px; border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 9px 16px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(10,116,128,.3); }
.vhint { position: absolute; left: 12px; bottom: 10px; margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); pointer-events: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: auto; padding: 16px; min-height: 0; display: grid; gap: 12px; align-content: start; grid-auto-rows: max-content; }
.welcome { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 12px; align-items: center; }
.welcome img { width: 76px; }
.panel h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.1; margin: 0 0 4px; }
.panel p { margin: 4px 0; }
.mission { display: flex; gap: 10px; align-items: center; background: linear-gradient(135deg, #0A7480, #075A63); color: #fff; border-radius: 14px; padding: 12px 14px; text-decoration: none; }
.mission b { font-family: var(--font-display); font-size: 18px; display: block; line-height: 1.1; }
.mission span { font-size: 13px; opacity: .9; }
.mission .go { margin-left: auto; font-size: 24px; font-weight: 800; }
.groups p { margin: 6px 0; }
.tag { display: inline-block; color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.big { font-size: 17px; font-weight: 700; }
.names { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.names span { background: var(--surface-2); border-radius: 8px; padding: 2px 8px; font-family: var(--font-code); font-size: 13px; }
.can { display: grid; gap: 6px; }
.can div { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 10px; padding: 6px 10px; background: var(--accent-soft); font-weight: 800; }
.can div.no { background: var(--surface-2); color: #8A96A0; }
.can div.no .yn::before { content: '✗ no'; }
.can div .yn::before { content: '✓ yes'; }
.can small { font-weight: 700; color: var(--muted); font-size: 12px; }
.note { background: #FFF6D6; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.note.info { background: var(--accent-soft); }
.trick { border: 2px dashed var(--accent); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.trick code, .code-inline { font-family: var(--font-code); background: var(--surface-2); border-radius: 6px; padding: 0 5px; }
details.code { border-radius: 12px; background: var(--surface-2); }
details.code > summary { cursor: pointer; font-weight: 800; padding: 8px 12px; }
details.code[open] > summary { border-bottom: 1px solid var(--line); }
details.code .exs { display: grid; gap: 10px; padding: 10px; }
.ex { border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.ex .head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 12px; background: #0D171F; color: #9FB3C0; font-weight: 800; font-size: 13px; }
.ex .head button { border: 1px solid #36505F; background: #1C2E3A; color: var(--code-ink); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 12px; cursor: pointer; }
.ex pre { margin: 0; padding: 10px 12px; color: var(--code-ink); font-family: var(--font-code); font-size: 12.5px; line-height: 1.55; white-space: pre; overflow-x: auto; }
.ex .c { color: #8FA8B5; font-style: italic; }
.lab { border: 2px solid #3aa0ff; border-radius: 12px; padding: 10px 12px; background: #EEF6FF; }
.lab b { display: block; margin-bottom: 4px; }
.lab .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.lab button { border: 0; border-radius: 10px; padding: 8px 12px; font-family: var(--font-code); font-weight: 600; background: var(--code-bg); color: var(--code-ink); cursor: pointer; }
.back-btn { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 800; cursor: pointer; }
.small { color: var(--muted); font-size: 13px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-weight: 800; color: var(--accent-strong); font-size: 14px; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  .viewport { height: 62vh; min-height: 380px; }
  .tools { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <a class="back" href="index.html">← All lessons</a>
      <h1>ESP32 Pin Explorer</h1>
      <p>ESP32 DevKit V1 · 30 pins · the board in every lesson</p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="kid" aria-pressed="true">🧭 Explorer</button>
        <button type="button" data-view="pro" aria-pressed="false">🛠️ Pro</button>
      </div>
      <div class="seg" role="group" aria-label="Pin label style">
        <button type="button" data-mode="printed" aria-pressed="true">Printed name</button>
        <button type="button" data-mode="gpio" aria-pressed="false">GPIO number</button>
        <button type="button" data-mode="pos" aria-pressed="false" data-pro-only>Header position</button>
      </div>
      <button type="button" class="bookbtn" data-wordbook>📖 My words <span id="wordCount"></span></button>
    </div>
  </header>
  <div class="legend" id="legend" aria-label="Pin groups: tap to highlight"></div>
  <main>
    <section class="viewport" aria-label="3D ESP32 board">
      <div id="scene"></div>
      <div class="labels" id="labels"></div>
      <button class="reset" id="resetView" type="button">↺ Reset view</button>
      <p class="vhint">Drag to spin · Pinch or scroll to zoom · Tap a pin or a part</p>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="assets/esp32/board.js"></script>
<script>
(function () {
  'use strict';
  const E = window.ESP32, esc = E.esc, chip = E.chip;
  const $ = (s) => document.querySelector(s);
  const panel = $('#panel');
  let view = 'kid', mode = 'printed', filter = null, selected = null;
  try { if (localStorage.getItem('iotkids.pinsView') === 'pro') view = 'pro'; } catch (e) {}
  E.initWords();
  const countWords = () => { $('#wordCount').textContent = `(${E.book.list().length})`; };
  document.addEventListener('makerword', countWords); countWords();

  const groupKey = (p) => (view === 'kid' ? E.groupOf(p) : p.type);
  const groups = () => (view === 'kid' ? E.GROUPS : E.TYPES);
  const colour = (p) => groups()[groupKey(p)].css;
  function labelText(p) {
    if (mode === 'gpio') return p.gpio != null ? 'GPIO' + p.gpio : p.printed;
    if (mode === 'pos') return p.side + p.pos;
    return p.printed;
  }

  const viewer = E.createViewer({
    host: $('#scene'), layer: $('#labels'), model: 'assets/models/esp32-devkit-v1.glb',
    onPin: (p) => selectPin(p), onPart: (k) => selectPart(k),
    label: (p) => ({ text: labelText(p), color: colour(p), aria: `${p.printed}${p.gpio != null ? ', GPIO ' + p.gpio : ''}, ${groups()[groupKey(p)].name}`,
      cls: (selected === p ? 'sel' : '') + (filter && groupKey(p) !== filter ? ' dim' : '') }),
  });
  if (!viewer) return;
  $('#resetView').addEventListener('click', () => viewer.home(true));
  viewer.ready.then(() => {
    paintPads();
    const q = new URLSearchParams(location.search).get('pin');
    const p = E.findPin(q);
    if (p) selectPin(p); else showWelcome();
  });

  /* ---------- views, label modes, legend ---------- */
  function setView(v) {
    view = v; filter = null;
    try { localStorage.setItem('iotkids.pinsView', v); } catch (e) {}
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    document.querySelectorAll('[data-pro-only]').forEach((b) => { b.hidden = v !== 'pro'; });
    if (v !== 'pro' && mode === 'pos') setMode('printed');
    buildLegend(); paintPads(); viewer.refresh();
    if (selected) selectPin(selected); else showWelcome();
  }
  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    viewer.refresh();
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  function buildLegend() {
    const legend = $('#legend'); legend.innerHTML = '';
    Object.entries(groups()).forEach(([k, g]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.title = g.blurb; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<i style="background:${g.css}"></i>${esc(g.name)}`;
      b.addEventListener('click', () => {
        filter = filter === k ? null : k;
        legend.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        if (filter) b.setAttribute('aria-pressed', 'true');
        paintPads(); viewer.refresh();
      });
      legend.appendChild(b);
    });
    legend.insertAdjacentHTML('beforeend', '<span class="hint">Tap a colour to highlight those pins</span>');
  }
  function paintPads() {
    E.PINS.forEach((p) => {
      const dim = filter && groupKey(p) !== filter;
      viewer.setPadColor(p.node, dim ? 0x9aa6b0 : colour(p));
      viewer.setPadGlow(p.node, selected === p);
    });
  }

  /* ---------- panel ---------- */
  function showWelcome() {
    selected = null; paintPads(); viewer.refresh(); viewer.setBlue(false);
    const g = groups();
    panel.innerHTML = `
      <div class="welcome"><img src="assets/ohm/magnify.svg" alt="Officer Ohm with a magnifying glass">
        <div><h2>Every pin has a job</h2><p>Your ${chip('microcontroller', 'ESP32')} has 30 ${chip('pin', 'pins')}. Tap one to find out what it does.</p></div></div>
      <a class="mission" href="lessons/00-meet-esp32/index.html"><span style="font-size:30px">🕵️</span><span><b>New here? Take the Pin Detective mission</b><span>15 minutes, earns your first badge</span></span><span class="go">→</span></a>
      <div class="trick">🧠 <b>The name trick:</b> in code, <code>Pin(25)</code> means ${chip('gpionum', 'GPIO')} 25. The board prints it as <b>D25</b>. It is <b>not</b> the 25th pin! Flip the labels to <b>GPIO number</b> at the top to see.</div>
      <div class="groups">${Object.values(g).map((x) => `<p><span class="tag" style="background:${x.css}">${esc(x.name)}</span> ${esc(x.blurb)}</p>`).join('')}</div>
      <p class="small">Yellow words like ${chip('gnd', 'GND')} are <b>maker words</b>: the real names engineers use. Tap them to learn them and fill your word book.</p>
      ${view === 'pro' ? `<div class="links"><a href="assets/models/esp32-devkit-v1.glb" download>Download 3D model (GLB)</a><a href="assets/models/esp32-devkit-v1.obj" download>OBJ</a><a href="assets/models/esp32-devkit-v1.mtl" download>MTL</a></div>` : ''}`;
  }

  function kidHeadline(p) {
    if (p.type === 'gnd') return `🏠 This is a road home for electricity (${chip('gnd', 'GND')}).`;
    if (p.type === 'power') return `⚡ This pin is about ${chip('voltage', 'power')}. Handle it with care!`;
    if (p.type === 'ctrl') return `🔄 This pin restarts the board.`;
    if (p.type === 'comm') return `💬 This pin talks to your computer. Leave it free.`;
    if (p.type === 'inonly') return `👂 This pin can only listen. It can’t light an LED.`;
    if (p.type === 'care') return `⚠️ This pin works, but it has a job when the board starts.`;
    return `✅ This pin is free for your projects!`;
  }
  function selectPin(p) {
    selected = p; paintPads(); viewer.refresh();
    viewer.setBlue(false); if (p.gpio === 2) viewer.blink(3000);
    const g = groups()[groupKey(p)], a = E.abilities(p), exs = E.examples(p), pro = view === 'pro';
    const names = `<div class="names"><span>Printed: ${esc(p.printed)}</span>${p.gpio != null ? `<span>Code: Pin(${p.gpio})</span>` : ''}<span>Header: ${p.side === 'L' ? 'left' : 'right'} #${p.pos}</span>${pro && E.TOUCH[p.gpio] ? `<span>Touch ${E.TOUCH[p.gpio]}</span>` : ''}</div>`;
    const can = p.gpio != null ? `<p style="font-weight:800;margin:10px 0 2px">Can it…?</p><div class="can">${Object.entries(E.ABILITIES).map(([k, x]) =>
      `<div class="${a.includes(k) ? '' : 'no'}"><span>${x.kid} <small>· pros say ${chip(x.word, x.pro)}</small></span><span class="yn"></span></div>`).join('')}</div>` : '';
    const lab = p.gpio === 2 ? `<div class="lab"><b>🔬 Try it: control the blue LED</b><span class="code-inline">led = Pin(2, Pin.OUT)</span>
      <div class="row"><button type="button" data-led="1">led.value(1)</button><button type="button" data-led="0">led.value(0)</button></div>
      <p class="small" id="labOut">Run a line and watch the blue LED on the board.</p></div>` : '';
    const trick = p.gpio != null && p.printed !== 'GPIO' + p.gpio ? `<div class="trick">🧠 Printed <b>${esc(p.printed)}</b> on the board = <code>Pin(${p.gpio})</code> in code = ${chip('gpionum', 'GPIO')} ${p.gpio}.</div>` : '';
    const code = exs.length ? `<details class="code" ${pro ? 'open' : ''}><summary>👩‍💻 ${pro ? 'MicroPython examples' : 'Show me the code'}</summary><div class="exs">${exs.map(([title, c], i) =>
      `<div class="ex"><div class="head">${esc(title)}<button type="button" data-copy="${i}">Copy</button></div><pre>${esc(c).replace(/(#.*)$/gm, '<span class="c">$1</span>')}</pre></div>`).join('')}</div></details>` : '';
    panel.innerHTML = `<div>
        <span class="tag" style="background:${g.css}">${esc(g.name)}</span>
        <h2>${esc(p.printed)}${p.gpio != null ? ` <span style="color:var(--muted);font-size:18px">· GPIO ${p.gpio}</span>` : ''}</h2>
        ${pro ? '' : `<p class="big">${kidHeadline(p)}</p>`}
        <p>${E.linkWords(p.text)}</p>
        ${p.extra ? `<p class="note">⚠️ ${E.linkWords(p.extra)}</p>` : ''}
        ${names}
      </div>${trick}${lab}${can}${code}
      <button type="button" class="back-btn" id="backBtn">← All pins</button>`;
    panel.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
      const done = () => { b.textContent = 'Copied!'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(exs[+b.dataset.copy][1]).then(done, () => {}); else done();
    }));
    panel.querySelectorAll('[data-led]').forEach((b) => b.addEventListener('click', () => {
      const on = b.dataset.led === '1';
      viewer.setBlue(on);
      $('#labOut').textContent = on ? 'GPIO 2 now gives out 3.3 volts, so the blue LED lights up.' : 'GPIO 2 is back to 0 volts, so the LED is off.';
    }));
    $('#backBtn').addEventListener('click', showWelcome);
    panel.scrollTop = 0;
  }
  function selectPart(key) {
    selected = null; paintPads(); viewer.refresh();
    const part = E.PARTS[key];
    if (key === 'blue_led_gpio2') viewer.blink(4000);
    panel.innerHTML = `<div><span class="tag" style="background:var(--accent)">Board part</span><h2>${esc(part.title)}</h2><p>${esc(part.text)}</p>
      ${part.words.length ? `<p class="small">Maker words: ${part.words.map((w) => chip(w)).join(' ')}</p>` : ''}</div>
      <button type="button" class="back-btn" id="backBtn">← All pins</button>`;
    $('#backBtn').addEventListener('click', showWelcome);
  }

  setView(view);
})();
</script>
</body>
</html>
